<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提供・実績 - Verdafly</title>
    <meta name="description" content="Verdaflyが提供・運用している公開コンテンツやプロジェクトの一覧。文化資料保存会など、外部に公開している活動を掲載しています。">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --panel: rgba(15, 23, 42, 0.76);
            --panel-strong: rgba(15, 23, 42, 0.92);
            --line: rgba(148, 163, 184, 0.18);
            --line-strong: rgba(52, 211, 153, 0.32);
            --text: #f8fafc;
            --muted: #a7b4c6;
            --quiet: #738196;
            --emerald-light: #34d399;
            --blue: #60a5fa;
            --amber: #f59e0b;
            --focus: rgba(52, 211, 153, 0.42);
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.26);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(180deg, #08111d 0%, #0a0f1a 48%, #111827 100%);
            background-size: 72px 72px, 72px 72px, auto;
            line-height: 1.7;
        }

        a {
            color: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 4px;
        }

        .container {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(10, 15, 26, 0.84);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            min-height: 76px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        .brand img {
            width: 38px;
            height: 38px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link,
        .lang-btn,
        .filter-btn {
            min-height: 42px;
            border-radius: 8px;
            font: inherit;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            color: var(--muted);
            padding: 8px 12px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .nav-link:hover {
            color: var(--emerald-light);
        }

        .lang-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
        }

        .lang-btn {
            padding: 0 10px;
            color: var(--quiet);
            background: transparent;
            border: 0;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        .lang-btn.active {
            color: #04130d;
            background: var(--emerald-light);
        }

        .hero {
            padding: 72px 0 56px;
            border-bottom: 1px solid var(--line);
        }

        .hero-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
            align-items: end;
            gap: 36px;
        }

        .eyebrow,
        .card-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--emerald-light);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        h1 {
            margin: 16px 0 18px;
            max-width: 760px;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 4.6rem;
            line-height: 1.04;
            letter-spacing: 0;
        }

        .lead {
            max-width: 760px;
            margin: 0;
            color: var(--muted);
            font-size: 1.12rem;
        }

        .hero-panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(17, 24, 39, 0.74));
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .metric {
            min-height: 112px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.035);
        }

        .metric strong {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 2rem;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .metric span {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .section {
            padding: 56px 0 72px;
        }

        .toolbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .section-copy h2 {
            margin: 0 0 8px;
            font-size: 2rem;
            line-height: 1.25;
            letter-spacing: 0;
        }

        .section-copy p {
            margin: 0;
            color: var(--muted);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }

        .filter-btn {
            padding: 0 14px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: #03130d;
            border-color: var(--emerald-light);
            background: var(--emerald-light);
        }

        .work-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .work-card {
            position: relative;
            display: grid;
            min-height: 360px;
            grid-template-rows: auto 1fr auto auto;
            gap: 22px;
            padding: 26px;
            overflow: hidden;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
            transition: border-color 180ms ease, transform 180ms ease, background 180ms ease;
        }

        .work-card::before {
            content: '';
            position: absolute;
            inset: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--emerald-light), var(--blue), var(--amber));
        }

        .work-card:hover {
            transform: translateY(-4px);
            border-color: var(--line-strong);
            background: var(--panel-strong);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
        }

        .work-icon {
            display: inline-flex;
            width: 58px;
            height: 58px;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 8px;
            color: #fee2e2;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.26), rgba(96, 165, 250, 0.15));
            font-size: 1.55rem;
        }

        .status {
            display: inline-flex;
            min-height: 32px;
            align-items: center;
            padding: 4px 10px;
            border: 1px solid rgba(52, 211, 153, 0.28);
            border-radius: 999px;
            color: var(--emerald-light);
            background: rgba(16, 185, 129, 0.1);
            font-size: 0.8rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .card-body h3 {
            margin: 8px 0 12px;
            font-size: 1.65rem;
            line-height: 1.25;
            letter-spacing: 0;
        }

        .card-body p {
            min-width: 0;
            margin: 0;
            color: var(--muted);
        }

        .fact-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 20px 0 0;
        }

        .fact {
            min-height: 74px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.035);
        }

        .fact span {
            display: block;
            color: var(--quiet);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .fact strong {
            display: block;
            margin-top: 3px;
            color: var(--text);
            font-size: 0.93rem;
            line-height: 1.45;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-flex;
            min-height: 30px;
            align-items: center;
            padding: 4px 10px;
            border: 1px solid rgba(96, 165, 250, 0.24);
            border-radius: 999px;
            color: #bfdbfe;
            background: rgba(96, 165, 250, 0.08);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
            color: var(--emerald-light);
            font-weight: 800;
        }

        .card-url {
            display: block;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            color: var(--quiet);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .site-footer {
            padding: 28px 0 38px;
            border-top: 1px solid var(--line);
            color: var(--quiet);
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .footer-links a:hover {
            color: var(--emerald-light);
        }

        @media (max-width: 880px) {
            .header-inner,
            .toolbar,
            .footer-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav {
                flex-wrap: wrap;
            }

            .hero-layout,
            .work-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 3rem;
            }

            .filters {
                justify-content: flex-start;
            }
        }

        @media (max-width: 560px) {
            .hero {
                padding-top: 48px;
            }

            h1 {
                font-size: 2.45rem;
            }

            .lead {
                font-size: 1rem;
            }

            .work-card {
                min-height: auto;
                padding: 22px;
            }

            .card-top,
            .card-footer {
                align-items: flex-start;
                flex-direction: column;
                width: 100%;
            }

            .card-url {
                width: 100%;
            }

            .fact-list,
            .metric-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <a class="brand" href="../" aria-label="Verdafly home">
                    <img src="../favicon.svg" alt="">
                    <span>Verdafly</span>
                </a>
                <div class="nav">
                    <a class="nav-link" href="../#services" data-i18n="nav.services">サービス内容</a>
                    <a class="nav-link" href="./" aria-current="page" data-i18n="nav.works">提供・実績</a>
                    <div class="lang-toggle" aria-label="Language">
                        <button class="lang-btn active" type="button" data-lang="ja" aria-pressed="true">JP</button>
                        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-layout">
                    <div>
                        <span class="eyebrow" data-i18n-html="hero.eyebrow"><i class="fas fa-layer-group"></i> Verdafly Works</span>
                        <h1 data-i18n="hero.title">提供物と実績を一覧できる場所</h1>
                        <p class="lead" data-i18n="hero.lead">Verdaflyが公開・運用しているコンテンツ、活動、アプリを、リンク先と運用目的が分かる形で整理します。</p>
                    </div>
                    <aside class="hero-panel" aria-labelledby="overview-title">
                        <span class="eyebrow" id="overview-title" data-i18n-html="overview.title"><i class="fas fa-chart-simple"></i> Overview</span>
                        <div class="metric-grid">
                            <div class="metric">
                                <strong id="metric-total">1</strong>
                                <span data-i18n="overview.items">掲載中の提供・実績</span>
                            </div>
                            <div class="metric">
                                <strong id="metric-public">1</strong>
                                <span data-i18n="overview.public">外部公開中</span>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </section>

        <section class="section" aria-labelledby="works-title">
            <div class="container">
                <div class="toolbar">
                    <div class="section-copy">
                        <h2 id="works-title" data-i18n="works.title">一覧</h2>
                        <p data-i18n="works.desc">カードは公開先を主リンクにしています。今後のゲーム、アプリ、配信活動も同じ形式で追加します。</p>
                    </div>
                    <div class="filters" id="filters" aria-label="Works filters"></div>
                </div>
                <div class="work-grid" id="work-grid"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <span data-i18n-html="footer.copyright">&copy; 2026 Verdafly.</span>
                <nav class="footer-links" aria-label="Footer navigation">
                    <a href="../" data-i18n="footer.home">Home</a>
                    <a href="../#services" data-i18n="nav.services">サービス内容</a>
                    <a href="./" data-i18n="nav.works">提供・実績</a>
                </nav>
            </div>
        </div>
    </footer>

    <script>
        const i18n = {
            ja: {
                'nav.services': 'サービス内容',
                'nav.works': '提供・実績',
                'hero.eyebrow': '<i class="fas fa-layer-group"></i> Verdafly Works',
                'hero.title': '提供物と実績を一覧できる場所',
                'hero.lead': 'Verdaflyが公開・運用しているコンテンツ、活動、アプリを、リンク先と運用目的が分かる形で整理します。',
                'overview.title': '<i class="fas fa-chart-simple"></i> Overview',
                'overview.items': '掲載中の提供・実績',
                'overview.public': '外部公開中',
                'works.title': '一覧',
                'works.desc': 'カードは公開先を主リンクにしています。今後のゲーム、アプリ、配信活動も同じ形式で追加します。',
                'filter.all': 'すべて',
                'fact.type': '種別',
                'fact.scope': '提供内容',
                'footer.home': 'Home',
                'footer.copyright': '&copy; 2026 Verdafly.'
            },
            en: {
                'nav.services': 'Services',
                'nav.works': 'Works',
                'hero.eyebrow': '<i class="fas fa-layer-group"></i> Verdafly Works',
                'hero.title': 'A catalog of Verdafly work',
                'hero.lead': 'Public content, activities, and apps operated by Verdafly are organized here with their destination links and purpose.',
                'overview.title': '<i class="fas fa-chart-simple"></i> Overview',
                'overview.items': 'Listed works',
                'overview.public': 'Publicly available',
                'works.title': 'Catalog',
                'works.desc': 'Each card links to the public destination. Future games, apps, and publishing activities can be added in the same format.',
                'filter.all': 'All',
                'fact.type': 'Type',
                'fact.scope': 'Offering',
                'footer.home': 'Home',
                'footer.copyright': '&copy; 2026 Verdafly.'
            }
        };

        // Add future offerings here; the card list and filters render from this array.
        const works = [
            {
                id: 'bunka-shiryo-hozonkai',
                category: 'channel',
                public: true,
                url: 'https://www.youtube.com/channel/UCjLR5rRK7Wj59-QbdPDxEHQ',
                icon: 'fa-brands fa-youtube',
                ja: {
                    title: '文化資料保存会',
                    kicker: 'YouTubeチャンネル',
                    status: '公開中',
                    categoryLabel: 'チャンネル',
                    type: '文化資料アーカイブ',
                    scope: '資料選定、権利確認、動画化、公開運用',
                    summary: '著作権保護期間が満了した資料、または権利上問題のない歴史的・文化的資料を、YouTubeで閲覧しやすい形にして公開する活動です。',
                    cta: 'YouTubeチャンネルを見る',
                    tags: ['デジタルアーカイブ', 'YouTube', '文化資料', '権利確認']
                },
                en: {
                    title: 'Culture Materials Preservation',
                    kicker: 'YouTube Channel',
                    status: 'Public',
                    categoryLabel: 'Channel',
                    type: 'Cultural archive',
                    scope: 'Source selection, rights checks, video production, publishing operations',
                    summary: 'An activity that makes public-domain or otherwise rights-cleared historical and cultural materials easier to view on YouTube.',
                    cta: 'Open YouTube channel',
                    tags: ['Digital archive', 'YouTube', 'Cultural materials', 'Rights checks']
                }
            }
        ];

        let currentLang = 'ja';
        let currentFilter = 'all';

        function t(key) {
            return i18n[currentLang][key] || key;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function renderStaticText() {
            document.documentElement.lang = currentLang;
            document.title = currentLang === 'ja' ? '提供・実績 - Verdafly' : 'Works - Verdafly';
            document.querySelector('meta[name="description"]').content = currentLang === 'ja'
                ? 'Verdaflyが提供・運用している公開コンテンツやプロジェクトの一覧。文化資料保存会など、外部に公開している活動を掲載しています。'
                : 'A catalog of public content and projects provided or operated by Verdafly, including Culture Materials Preservation.';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-html]').forEach(el => {
                const key = el.getAttribute('data-i18n-html');
                el.innerHTML = t(key);
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                const active = btn.dataset.lang === currentLang;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-pressed', String(active));
            });
        }

        function getCategories() {
            const map = new Map();
            works.forEach(item => {
                map.set(item.category, item[currentLang].categoryLabel);
            });
            return [['all', t('filter.all')], ...map.entries()];
        }

        function renderFilters() {
            const filters = document.getElementById('filters');
            filters.innerHTML = getCategories().map(([id, label]) => `
                <button class="filter-btn${id === currentFilter ? ' active' : ''}" type="button" data-filter="${escapeHtml(id)}" aria-pressed="${id === currentFilter}">
                    ${escapeHtml(label)}
                </button>
            `).join('');

            filters.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    render();
                });
            });
        }

        function renderCards() {
            const grid = document.getElementById('work-grid');
            const filtered = currentFilter === 'all'
                ? works
                : works.filter(item => item.category === currentFilter);

            grid.innerHTML = filtered.map(item => {
                const content = item[currentLang];
                const tags = content.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
                return `
                    <a class="work-card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" data-category="${escapeHtml(item.category)}">
                        <div class="card-top">
                            <span class="work-icon" aria-hidden="true"><i class="${escapeHtml(item.icon)}"></i></span>
                            <span class="status">${escapeHtml(content.status)}</span>
                        </div>
                        <div class="card-body">
                            <span class="card-kicker">${escapeHtml(content.kicker)}</span>
                            <h3>${escapeHtml(content.title)}</h3>
                            <p>${escapeHtml(content.summary)}</p>
                            <div class="fact-list">
                                <div class="fact">
                                    <span>${escapeHtml(t('fact.type'))}</span>
                                    <strong>${escapeHtml(content.type)}</strong>
                                </div>
                                <div class="fact">
                                    <span>${escapeHtml(t('fact.scope'))}</span>
                                    <strong>${escapeHtml(content.scope)}</strong>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="tag-list">${tags}</div>
                        </div>
                        <div class="card-footer">
                            <span>${escapeHtml(content.cta)} <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i></span>
                            <span class="card-url">${escapeHtml(item.url.replace('https://', ''))}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function renderMetrics() {
            document.getElementById('metric-total').textContent = works.length;
            document.getElementById('metric-public').textContent = works.filter(item => item.public).length;
        }

        function render() {
            renderStaticText();
            renderFilters();
            renderCards();
            renderMetrics();
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                render();
            });
        });

        render();
    </script>
</body>

</html>
